<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta  name="viewport"  content="width=device-width, initial-scale=1.0">
    <title>LuckyWe - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <div class="card border-0 shadow-sm rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-secondary mb-0">
                            <h2 class="text-center fw-bold mb-2">LuckyWe</h2>                            
                            <p class="text-center text-muted mb-4">Login to your account</p>
                        </div>
                        <div id="error-message" class="alert alert-danger d-none"></div>
                            
                        <form id="login-form">
                            <div class="mb-3">

                                <label for="email" class="form-label fw-semibold">Email</label>
                          
                                <input type="email"   id="email" class="form-control"  placeholder="Enter your email" required>
                               
                                <p id="email-error" class="text-danger small mb-0 mt-1"></p>
                            </div>

                            <div class="mb-4">
                                <label for="password"  class="form-label fw-semibold">Password</label>
                       
                                <input   type="password" id="password"  class="form-control"  placeholder="Enter your password" required>
                                <p id="password-error" class="text-danger small mb-0 mt-1" ></p>          
                        
                            </div>

                            <button type="submit" id="login-btn" class="btn btn-primary w-100">Login</button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            Don't have an account?
                            <a  href="./register.html" class="text-decoration-none fw-semibold">Register</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../js/auth.js"> </script>

</body>

</html>
