<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta  name="viewport"  content="width=device-width, initial-scale=1.0">
    <title>LuckyWe - Products</title>
    <link   href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"   rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="./admin.html">LuckyWe</a>
            <div>
                <a href="./admin.html" class="btn btn-outline-light me-2">Dashboard</a>
                <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container mt-5"> 
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Products</h2>
            <button class="btn btn-primary" id="addProductBtn">Add Product</button>
        </div>
        <div id="message" class="alert d-none"></div>
        <div id="productFormContainer" class="card shadow-sm mb-4 d-none">
            <div class="card-body">
                <h4 id="formTitle">Add Product</h4>
                <form id="productForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Product Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <input type="text" id="category" class="form-control" required>                        
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" id="price" class="form-control" min="0" step="0.01"  required>
                    </div>
                    <div class="mb-3">  
                        <label for="stock" class="form-label">Stock</label>
                        <input type="number" id="stock" class="form-control" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit"  class="btn btn-primary" id="saveBtn">Add Product</button>
                    <button type="button" class="btn btn-secondary ms-2" id="cancelBtn">Cancel</button>
                </form>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../js/admin/products.js"></script>
</body>
</html>
