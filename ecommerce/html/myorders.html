<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyWe - My Orders</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
    <link  rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a href="./product.html" class="navbar-brand fw-bold text-primary">LuckyWe</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#customerNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div  class="collapse navbar-collapse" id="customerNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a href="./product.html" class="nav-link">Products</a>
                    </li>
                    <li class="nav-item">
                        <a href="./wishlist.html" class="nav-link">Wishlist
                            <span id="wishlist-count" class="badge bg-danger">0</span>
                        </a>                       
                    </li>
                    <li class="nav-item">
                        <a href="./cart.html" class="nav-link">cart
                            <span id="cart-count" class="badge bg-primary">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./myorders.html" class="nav-link active fw-semibold">My Orders</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">👤 User</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <button type="button"  class="dropdown-item" data-bs-toggle="modal" 
                                data-bs-target="#profileModal">My Profile</button>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <button  type="button"  id="logout-btn" class="dropdown-item text-danger">Logout</button>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-4">
        <div class="mb-4">
            <h2 class="fw-bold mb-1"> My Orders</h2>
            <p class="text-secondary mb-0">View your previous orders.</p>
        </div>
        <div id="error-message" class="alert alert-danger d-none"></div>
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-secondary mt-3">Loading orders... </p>
        </div>
        <div id="empty-orders" class="card border-0 shadow-sm text-center d-none">
            <div class="card-body py-5">
                <div class="fs-1 mb-3">📦</div>
                <h4 class="fw-bold">No Orders Yet</h4>
                <p class="text-secondary">You have not placed any orders yet.</p>
                <a href="./product.html" class="btn btn-primary">Start Shopping</a>
            </div>
        </div>
        <div id="orders-container"></div>
    </div>
    <div  class="modal fade"  id="profileModal"  tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">My Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="text-secondary"> Name</label>
                        <p id="profile-name" class="fw-semibold mb-0" >-</p>
                    </div>
                    <div class="mb-3">
                        <label class="text-secondary">Email</label>
                        <p id="profile-email" class="fw-semibold mb-0">-</p>
                    </div>
                    <div class="mb-3">
                        <label class="text-secondary">Phone</label>
                        <p id="profile-phone" class="fw-semibold mb-0">-</p>                           
                    </div>
                    <div class="mb-3">
                        <label class="text-secondary">Address</label>
                        <p id="profile-address" class="fw-semibold mb-0">-</p>
                    </div>
                    <div>
                        <label class="text-secondary">Account Type</label>
                        <p id="profile-role" class="fw-semibold mb-0">-</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/myorder.js"></script>

</body>
</html>
