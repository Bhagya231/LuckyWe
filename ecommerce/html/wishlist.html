<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyWe - Wishlist</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">
            <a href="./product.html" class="navbar-brand fw-bold text-primary">LuckyWe</a>
            <div class="d-flex align-items-center">
                <a href="./product.html" class="btn btn-outline-primary me-2">Products</a>
                <a href="./cart.html" class="btn btn-outline-primary me-2">Cart</a>
                <a href="./myorders.html" class="btn btn-outline-primary me-2"> My Orders</a>
                <button  class="btn btn-outline-danger"  id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">My Wishlist</h2>
                <p class="text-secondary mb-0">Products you saved for later.</p>
            </div>
        </div>
        <div id="message" class="alert d-none"></div>
        <div id="wishlist-container" class="row g-4"></div>
        <div id="empty-wishlist" class="text-center py-5 d-none">
            <h4> Your wishlist is empty</h4>
            <p class="text-secondary">Add products to your wishlist to see them here.</p>
            <a href="./product.html" class="btn btn-primary">add Products to wishlist</a>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/wishlist.js"></script>
</body>
</html>
