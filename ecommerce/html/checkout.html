<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyWe - Checkout</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a href="./product.html" class="navbar-brand fw-bold text-primary">LuckyWe</a>
            <div class="ms-auto">
                <a href="./cart.html" class="btn btn-outline-primary btn-sm"> Back to Cart</a>
            </div>
        </div>
    </nav>
    <div class="container py-4">
        <div class="mb-4">
            <h2 class="fw-bold">Checkout</h2>
            <p class="text-secondary">Enter your delivery details to place the order.</p>
        </div>
        <div id="error-message" class="alert alert-danger d-none"></div>
        <div id="success-message" class="alert alert-success d-none"></div>
        <div class="row g-4">
            <div class="col-12 col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">Customer Details</h5>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" placeholder="Enter your name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" id="phone" class="form-control" placeholder="Enter 10 digits phone number">
                        </div>
                        <div class="mb-4">
                            <label for="address" class="form-label">Delivery Address</label>
                            <textarea id="address" class="form-control" rows="4" placeholder="Enter your delivery address"></textarea>
                        </div>
                        <button type="button" id="place-order-btn" class="btn btn-primary w-100">Place Order</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">Order Summary</h5>
                        <div id="checkout-items">
                            <p class="text-secondary">Loading items...</p>                                
                        </div>
                        <hr>                        
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Subtotal</span>
                            <span id="subtotal">₹0.00</span>  
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary"> Discount</span>
                            <span id="discount" class="text-success">₹0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold">Total</span>
                            <span id="total" class="fw-bold text-primary fs-5">₹0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/checkout.js"></script>
</body>
</html>
