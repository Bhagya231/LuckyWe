<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyWe - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h1 class="fw-bold text-primary">LuckyWe</h1>
                        <p class="text-muted mb-0">Create your account to get started.</p>
                    </div>
                    <div id="error-message" class="alert alert-danger d-none"></div>
                    <form id="register-form">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>                     
                            <input type="text"  id="name"  class="form-control" placeholder="Enter your name" required>
                            <p id="name-error" class="text-danger small mb-0 mt-1"></p>                             
                                
                        </div>
                        <div class="mb-3">

                            <label for="email"  class="form-label fw-semibold">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                            <p id="email-error" class="text-danger small mb-0 mt-1"></p>

                        </div>

                        <div class="mb-3">

                            <label for="phone" class="form-label fw-semibold"> Phone Number</label>
                            <input type="tel"  id="phone"  class="form-control" placeholder="Enter 10-digit phone number" maxlength="10" required>
                            <p id="phone-error" class="text-danger small mb-0 mt-1"></p>
                        </div>
                        <div class="mb-3">
                            <label  for="address" class="form-label fw-semibold">Address</label>
                            <textarea id="address" class="form-control" rows="3" placeholder="Enter your address"  required></textarea>
                            <p id="address-error" class="text-danger small mb-0 mt-1"></p>
                                
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                            <p id="password-error" class="text-danger small mb-0 mt-1"></p>
                        </div>
                        <button type="submit" id="register-btn"  class="btn btn-primary w-100">Create Account</button>
                    </form>
                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a  href="./login.html" class="text-decoration-none fw-semibold">
                            Login
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="../js/auth.js"></script>
</body>
</html>
