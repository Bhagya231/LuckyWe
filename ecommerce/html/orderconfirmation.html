<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyWe - Order Confirmation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a href="./product.html" class="navbar-brand fw-bold text-primary">LuckyWe</a>
        </div>
    </nav>
    <div class="container py-4">
        <div class="text-center mb-4">
            <div class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center mb-3"
                style="width: 70px; height: 70px; font-size: 32px;"> ✓ </div>
                <h2 class="fw-bold">Order Placed Successfully</h2>
                <p class="text-secondary">Thank you for shopping with LuckyWe.</p>
        </div>
        <div class="row g-4">
            <div class="col-12 col-lg-5">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">Customer Details</h5>
                        <div class="mb-3">
                            <small class="text-secondary">Name</small>
                            <div id="customer-name" class="fw-semibold"></div>

                        </div>
                        <div class="mb-3">
                            <small class="text-secondary">Email</small>
                            <div id="customer-email" class="fw-semibold"></div>
                        </div>
                        <div class="mb-3">
                            <small class="text-secondary">Phone</small>
                            <div id="customer-phone"  class="fw-semibold"></div>
                        </div>
                        <div>
                            <small class="text-secondary">Delivery Address</small>
                            <div id="customer-address" class="fw-semibold"></div>                                
                        </div>
                    </div>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">Order Information</h5>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-secondary">Order Number</span>
                            <span id="order-number"  class="fw-semibold"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-secondary">Order Date</span>
                            <span id="order-date" class="fw-semibold"></span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-secondary">Expected Delivery</span>
                            <span id="delivery-date" class="fw-semibold"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">Ordered Products</h5>
                        <div id="ordered-products"></div>
                        <hr>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary"> Subtotal</span>
                            <span id="subtotal">₹0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Discount</span>
                            <span id="discount" class="text-success">₹0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold"> Total</span>
                            <span id="total" class="fw-bold text-primary fs-5">₹0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="./myorders.html" class="btn btn-primary me-2"> View My Orders</a>
            <a href="./product.html" class="btn btn-outline-secondary"> Continue Shopping</a>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script  type="module" src="../js/orderconfirmation.js"></script>

</body>
</html>
